@if(loading){
  <tui-loader></tui-loader>
}@else {

  <h1>Admin - Config</h1>
  <div class="actions">
    <button
      tuiButton
      appearance="primary"
      size="s"
      [routerLink]="['/admin']"
    >Back</button>

  </div>
  <div class="form">

    <form [formGroup]="configForm" (submit)="onSubmit()">

      <div class="field">
        <tui-textfield
          iconStart="@tui.user"
        >
          <label tuiLabel>Name</label>
          <input
            placeholder="Name"
            tuiTextfield
            formControlName="name"
          />
        </tui-textfield>
      </div>
      <div class="description">
        <tui-textfield
          ngSkipHydration
          iconStart="@tui.text"
        >
          <label tuiLabel>Description</label>
          <textarea
            placeholder="Description"
            tuiTextarea
            formControlName="description"

            [limit]="100"
            [max]="6"
            [min]="3"
          ></textarea>
        </tui-textfield>
      </div>
      <div class="field">
        <button
          size="l"
          tuiButton
          type="submit"
        >
          Save
        </button>
      </div>

    </form>
  </div>

}
